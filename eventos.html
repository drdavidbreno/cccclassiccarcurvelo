<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/favicon.png" type="image/png">
  <title>Galeria de Eventos | C.C.C Classic Car Curvelo</title>
  <link rel="stylesheet" href="eventos.css?v=20260606ab">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="eventos-vanta-bg" id="eventosVantaBg" aria-hidden="true">
    <img class="eventos-vanta-logo" src="img/vanta-eventos/imagem.png" alt="">
  </div>
  <img class="eventos-mascote" src="img/mascoteeventos.webp" alt="" aria-hidden="true" decoding="async">

  <a class="page-back-plate" href="index.html?home=1" aria-label="Voltar para o in&iacute;cio">
    <img src="img/voltar.webp" alt="Voltar">
  </a>
  <header class="navbar">
    <nav aria-label="Menu principal">
      <a href="index.html?home=1">In&iacute;cio</a>
      <a href="historia.html">Hist&oacute;ria</a>
      <a href="sobre.html">Sobre</a>
      <a href="eventos.html" class="active">Eventos</a>
      <a href="contato.html">Contato</a>
    </nav>
    <a class="proximos-menu-button" href="proximos-eventos.html" aria-label="Abrir pr&oacute;ximos eventos"></a>
  </header>

  <main class="eventos-page-shell">
    <section class="galeria-hero" aria-labelledby="galeria-titulo">
      <img class="eventos-title-image" src="img/ccc.webp" alt="Eventos CCC" decoding="async">
    </section>

    <section class="eventos-gallery" aria-label="Eventos cadastrados">
      <div class="eventos-grid" id="eventosGrid"></div>
    </section>

    <section class="album-panel" id="albumPanel" aria-live="polite">
      <button class="album-close" id="albumClose" type="button" aria-label="Fechar &aacute;lbum">&times;</button>

      <aside class="album-info">
        <span class="album-kicker">&Aacute;lbum selecionado</span>
        <h2 id="albumTitle"></h2>
        <div class="album-meta" id="albumMeta"></div>
        <p id="albumDescription"></p>
        <button class="album-back" id="albumBack" type="button">&#8592; Voltar para galeria</button>
      </aside>

      <div class="album-content">
        <div class="album-empty" id="albumEmpty">
          <span>Fotos em breve</span>
          <p>Este evento ainda est&aacute; recebendo material fotogr&aacute;fico.</p>
        </div>

        <div class="album-viewer" id="albumViewer">
          <button class="album-nav album-prev" id="albumPrev" type="button" aria-label="Foto anterior">&#8249;</button>
          <img id="albumMainImage" src="" alt="" decoding="async">
          <button class="album-nav album-next" id="albumNext" type="button" aria-label="Pr&oacute;xima foto">&#8250;</button>
          <span class="photo-counter" id="photoCounter"></span>
        </div>

        <div class="album-thumbs" id="albumThumbs"></div>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" aria-modal="true" role="dialog" aria-label="Foto ampliada">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Fechar">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="Foto anterior">&#8249;</button>
    <img id="lightboxImage" src="" alt="Foto ampliada do evento" decoding="async">
    <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="Pr&oacute;xima foto">&#8250;</button>
    <span class="lightbox-counter" id="lightboxCounter"></span>
  </div>

  <audio id="raposaSound" preload="auto">
    <source src="audio/raposa.mp3" type="audio/mpeg">
  </audio>

  <script src="js/vanta-eventos/three.r134.min.js"></script>
  <script src="js/vanta-eventos/vanta.waves.min.js"></script>
  <script>
    (() => {
      const eventosVanta = document.getElementById("eventosVantaBg");
      const mascoteEventos = document.querySelector(".eventos-mascote");
      const raposaSound = document.getElementById("raposaSound");
      let raposaSoundTimer = null;

      mascoteEventos?.addEventListener("click", () => {
        if (!raposaSound) {
          return;
        }

        window.clearTimeout(raposaSoundTimer);
        raposaSound.pause();
        raposaSound.currentTime = 0;
        raposaSound.volume = 1;
        raposaSound.play().catch(() => {});

        raposaSoundTimer = window.setTimeout(() => {
          raposaSound.pause();
          raposaSound.currentTime = 0;
        }, 2000);
      });

      if (!eventosVanta || !window.VANTA || !window.VANTA.WAVES) {
        return;
      }

      window.VANTA.WAVES({
        el: eventosVanta,
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        color: 0x000000,
        backgroundAlpha: 0,
        shininess: 55,
        waveHeight: 22,
        waveSpeed: 1,
        zoom: 0.85
      });
    })();
  </script>
  <script src="eventos.js?v=20260606b"></script>
  <script src="js/nav-scroll.js"></script>
  <script src="js/page-transitions.js?v=20260605a"></script>
</body>
</html>
