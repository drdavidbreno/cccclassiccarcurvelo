<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Eventos | C.C.C Classic Car Curvelo</title>
  <link rel="stylesheet" href="eventos.css">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <a href="index.html?home=1" class="btn-voltar" aria-label="Voltar para o in&iacute;cio">&#8592;</a>

  <main class="eventos-page-shell">
    <section class="galeria-hero" aria-labelledby="galeria-titulo">
      <span class="galeria-kicker">Arquivo hist&oacute;rico CCC</span>
      <h1 id="galeria-titulo">Galeria de Eventos</h1>
      <p>Confira os melhores momentos dos encontros do Clube de Ve&iacute;culos Antigos de Curvelo.</p>
    </section>

    <section class="eventos-gallery" aria-label="Eventos cadastrados">
      <div class="eventos-grid" id="eventosGrid"></div>
    </section>

    <section class="album-panel" id="albumPanel" aria-live="polite">
      <button class="album-close" id="albumClose" type="button" aria-label="Fechar &aacute;lbum">&times;</button>

      <aside class="album-info">
        <span class="album-kicker">&Aacute;lbum selecionado</span>
        <h2 id="albumTitle"></h2>
        <div class="album-meta" id="albumMeta"></div>
        <p id="albumDescription"></p>
        <button class="album-back" id="albumBack" type="button">&#8592; Voltar para galeria</button>
      </aside>

      <div class="album-content">
        <div class="album-empty" id="albumEmpty">
          <span>Fotos em breve</span>
          <p>Este evento ainda est&aacute; recebendo material fotogr&aacute;fico.</p>
        </div>

        <div class="album-viewer" id="albumViewer">
          <button class="album-nav album-prev" id="albumPrev" type="button" aria-label="Foto anterior">&#8249;</button>
          <img id="albumMainImage" src="" alt="" decoding="async">
          <button class="album-nav album-next" id="albumNext" type="button" aria-label="Pr&oacute;xima foto">&#8250;</button>
          <span class="photo-counter" id="photoCounter"></span>
        </div>

        <div class="album-thumbs" id="albumThumbs"></div>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" aria-modal="true" role="dialog" aria-label="Foto ampliada">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Fechar">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="Foto anterior">&#8249;</button>
    <img id="lightboxImage" src="" alt="Foto ampliada do evento" decoding="async">
    <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="Pr&oacute;xima foto">&#8250;</button>
    <span class="lightbox-counter" id="lightboxCounter"></span>
  </div>

  <script src="eventos.js"></script>
</body>
</html>
