  </main>

  <div class="post-modal">
    <img src="img/PRODUTOS/post.webp?v=20260604a" alt="Post ampliado">
  </div>

  <script>
    document.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("click", () => {
        card.classList.toggle("virado");
      });
    });

    document.querySelectorAll(".comprar-btn").forEach((button) => {
      button.addEventListener("click", () => {
        const produto = button.parentElement.querySelector(".descricao").textContent.trim();
        const mensagem = `Ola, quero comprar: ${produto}`;
        const link = `https://wa.me/5538999299771?text=${encodeURIComponent(mensagem)}`;

        window.open(link, "_blank");
      });
    });

    const cardExtra = document.querySelector(".card-extra");

    cardExtra.addEventListener("click", () => {
      cardExtra.classList.toggle("aberto");
    });

    const post = document.querySelector(".post-canto");
    const postModal = document.querySelector(".post-modal");

    post.addEventListener("click", () => {
      postModal.classList.add("aberto");
    });

    postModal.addEventListener("click", () => {
      postModal.classList.remove("aberto");
    });
  </script>
  <script src="js/page-transitions.js?v=20260605a"></script>
</body>
</html>
