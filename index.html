<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In&iacute;cio</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body class="home-page">
  <div id="intro" aria-label="Introdu&ccedil;&atilde;o V8">
    <div class="intro-logo">
      <img src="img/logo.png" alt="CCC Car">
    </div>

    <model-viewer
      id="motorV8"
      src="modelos/motor.glb"
      camera-controls
      auto-rotate
      autoplay>
    </model-viewer>

    <button id="entrarBtn" type="button">LIGAR O V8</button>
  </div>

  <header class="navbar">
    <nav aria-label="Menu principal">
      <a href="index.html" class="active">In&iacute;cio</a>
      <a href="historia.html">Hist&oacute;ria</a>
      <a href="sobre.html">Sobre</a>
      <a href="eventos.html">Eventos</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main class="home">
    <section class="home-intro">
      <h1>CCC<br>Classiccar<br>curevelo</h1>
    </section>
  </main>

  <section class="chat-panel" id="chat-panel" aria-label="Atendente virtual CCC Car">
    <div class="chat-header">
      <div class="chat-avatar">CCC</div>
      <div>
        <strong>CCC Car</strong>
        <span>Atendente virtual</span>
      </div>
      <button class="chat-close" type="button" aria-label="Fechar chat">&times;</button>
    </div>

    <div class="chat-body" id="chat-body">
      <span class="chat-time">Agora</span>
      <div class="chat-row bot">
        <div class="chat-icon">C</div>
        <div>
          <p class="chat-bubble">Ol&aacute;, meu chapa! Sou o atendente virtual do CCC Car. Como posso ajudar?</p>
          <span class="chat-now">Agora mesmo</span>
        </div>
      </div>

      <div class="chat-options">
        <button type="button" data-chat-answer="historia">Hist&oacute;ria do clube</button>
        <button type="button" data-chat-answer="eventos">Eventos e encontros</button>
        <button type="button" data-chat-answer="contato">Falar com a gente</button>
        <button type="button" data-chat-answer="participar">Como participar</button>
      </div>
    </div>

    <form class="chat-form" id="chat-form">
      <button type="button" class="chat-attach" aria-label="Anexar">+</button>
      <input id="chat-input" type="text" placeholder="Digite uma mensagem" autocomplete="off">
      <button type="submit" class="chat-send">Enviar</button>
    </form>
  </section>

  <video
    autoplay
    loop
    muted
    playsinline
    preload="metadata"
    class="raposa-chat"
    aria-label="Abrir chat do CCC Car">
    <source src="video/raposa_sem_sombra.webm" type="video/webm">
  </video>

  <audio id="v8Sound" preload="auto">
    <source src="audio/v8.mp3" type="audio/mpeg">
  </audio>

  <script>
    const chatPanel = document.getElementById("chat-panel");
    const chatBody = document.getElementById("chat-body");
    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");
    const chatClose = document.querySelector(".chat-close");
    const raposaChat = document.querySelector(".raposa-chat");
    const btn = document.getElementById("entrarBtn");
    const intro = document.getElementById("intro");
    const audio = document.getElementById("v8Sound");

    const chatAnswers = {
      historia: "O CCC Car nasceu para reunir apaixonados por carros antigos em Curvelo. A linha do tempo mostra essa jornada de 2016 at\\u00E9 2026, com encontros, mem\\u00F3rias e tradi\\u00E7\\u00E3o.",
      eventos: "Os encontros celebram carros cl\\u00E1ssicos, amizade e boas hist\\u00F3rias. Acompanhe a p\\u00E1gina para ver os destaques de cada ano e novidades do clube.",
      contato: "Para falar com a gente, escolha o menu Contato ou mande sua mensagem por aqui que retornamos com as informa\\u00E7\\u00F5es do clube.",
      participar: "Se voc\\u00EA curte antigomobilismo, fam\\u00EDlia e estrada, j\\u00E1 est\\u00E1 no caminho certo. Entre em contato e venha conhecer o CCC Car de perto."
    };

    const addChatMessage = (message, type = "bot") => {
      const row = document.createElement("div");
      row.className = `chat-row ${type}`;

      const bubble = document.createElement("p");
      bubble.className = "chat-bubble";
      bubble.textContent = message;

      if (type === "bot") {
        const icon = document.createElement("div");
        icon.className = "chat-icon";
        icon.textContent = "C";
        row.appendChild(icon);
      }

      row.appendChild(bubble);
      chatBody.appendChild(row);
      chatBody.scrollTop = chatBody.scrollHeight;
    };

    const openChat = () => {
      chatPanel.classList.add("active");
      raposaChat.classList.add("chat-open");
      chatInput.focus();
    };

    const closeChat = () => {
      chatPanel.classList.remove("active");
      raposaChat.classList.remove("chat-open");
    };

    raposaChat.addEventListener("click", openChat);
    chatClose.addEventListener("click", closeChat);

    document.querySelectorAll("[data-chat-answer]").forEach((button) => {
      button.addEventListener("click", () => {
        const key = button.dataset.chatAnswer;
        addChatMessage(button.textContent, "user");
        addChatMessage(chatAnswers[key]);
      });
    });

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = chatInput.value.trim();

      if (!message) {
        return;
      }

      addChatMessage(message, "user");
      chatInput.value = "";
      addChatMessage("Recebi sua mensagem! Para um retorno mais certeiro, fale pelo menu Contato ou conte aqui se voc\\u00EA quer saber sobre hist\\u00F3ria, eventos ou participa\\u00E7\\u00E3o.");
    });

    btn.addEventListener("click", () => {
      btn.disabled = true;
      btn.textContent = "LIGANDO...";

      audio.currentTime = 0;
      audio.play().catch(() => {});

      setTimeout(() => {
        intro.classList.add("hide");
      }, 6000);
    });
  </script>
</body>
</html>
